<!doctype html>
<html><head><meta charset="utf-8">
<style>
  :root { --ink:#0C0C0C; --gray:#6B7075; --hair:#C2C7CC; --accent:#A8791F; --tint:#F7F2E6; --red:#D7261E; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1280px; height:640px; background:var(--tint); overflow:hidden; }
  .wrap { position:relative; width:1280px; height:640px; padding:0 96px; display:flex; align-items:center; }
  .left { flex:1; }
  .kicker { font:500 15px/1 "SF Mono", Menlo, monospace; letter-spacing:.18em; color:var(--accent); text-transform:uppercase; }
  h1 { margin-top:26px; font:600 76px/1 "SF Mono", Menlo, monospace; color:var(--ink); letter-spacing:-.02em; }
  .zh { margin-top:26px; font:600 40px/1.2 "Songti SC", serif; color:var(--ink); letter-spacing:.06em; }
  .sub { margin-top:34px; display:flex; flex-direction:column; align-items:flex-start; gap:12px; }
  .chip { font:500 18px/1 "PingFang SC", sans-serif; color:var(--ink); padding:9px 14px; border:1px solid var(--hair); background:#fff; border-radius:3px; }
  .chip b { color:var(--accent); font-weight:600; }
  .rule { position:absolute; left:96px; right:96px; bottom:56px; height:1px; background:var(--hair); }
  .foot { position:absolute; left:96px; bottom:30px; font:14px/1 "SF Mono", Menlo, monospace; color:var(--gray); letter-spacing:.08em; }

  /* 右侧：一页公文首页的缩微 */
  .page { position:relative; width:236px; height:330px; background:#fff; box-shadow:0 1px 0 var(--hair), 0 18px 40px -22px rgba(12,12,12,.35); transform:rotate(-2.2deg) scale(1.3); margin-right:70px; margin-top:-30px; }
  .page2 { position:absolute; right:190px; top:120px; width:236px; height:330px; background:#fff; box-shadow:0 18px 40px -26px rgba(12,12,12,.3); transform:rotate(4deg) scale(1.3); }
  .mark { position:absolute; top:38px; left:0; right:0; text-align:center; font:700 22px/1 "Songti SC", serif; color:var(--red); letter-spacing:.04em; }
  .docno { position:absolute; top:86px; left:0; right:0; text-align:center; font:9px/1 "Songti SC", serif; color:#333; }
  .red { position:absolute; top:100px; left:24px; right:24px; height:2px; background:var(--red); }
  .title { position:absolute; top:118px; left:40px; right:40px; height:9px; background:#222; border-radius:1px; }
  .title.t2 { top:132px; left:70px; right:70px; }
  .ln { position:absolute; left:24px; right:24px; height:4px; background:#D9DBDE; border-radius:1px; }
  .stamp { position:absolute; right:22px; top:250px; font:600 10px/1 "SF Mono", Menlo, monospace; color:#1F7A3E; background:#E7F3EA; padding:5px 7px; border-radius:2px; letter-spacing:.04em; }
  .chk { position:absolute; right:22px; font:600 10px/1 "SF Mono", Menlo, monospace; color:#1F7A3E; }
  h1.cn { font-family:"Songti SC", serif; font-weight:700; letter-spacing:.04em; font-size:64px; }
  .en { margin-top:18px; font:600 30px/1 "SF Mono", Menlo, monospace; color:#3A3D40; letter-spacing:-.01em; }
</style></head>
<body><div class="wrap">
  <div class="left">
    <div class="kicker">GB/T 9704 · open source · MIT</div>
    <h1 class="cn">公文生成与机检工具</h1>
    <div class="en">gongwen-kit</div>
    <div class="sub">
      <span class="chip"><b>本地</b> 运行，文件进文件出</span>
      <span class="chip"><b>修复</b> 现成稿，改动写成修订痕迹</span>
      <span class="chip"><b>国标</b> 版式自动排</span>
      <span class="chip"><b>机检</b> 体例 · 数字 · 文风</span>
    </div>
  </div>
  <div class="page2"></div>
  <div class="page">
    <div class="mark">××市人民政府文件</div>
    <div class="docno">×政发〔2026〕12号</div>
    <div class="red"></div>
    <div class="title"></div><div class="title t2"></div>
    <div class="ln" style="top:156px;right:120px"></div>
    <div class="ln" style="top:168px;left:40px"></div>
    <div class="ln" style="top:180px"></div>
    <div class="ln" style="top:192px;right:60px"></div>
    <div class="ln" style="top:210px;left:40px;width:60px;background:#888"></div>
    <div class="ln" style="top:222px;left:40px"></div>
    <div class="ln" style="top:234px"></div>
    <div class="ln" style="top:246px;right:150px"></div>
    <div class="stamp">✓ 体例　✓ 数字　✓ 文风</div>
    <div class="ln" style="top:300px;left:24px;right:24px;height:1px;background:#222"></div>
    <div class="ln" style="top:312px;left:30px;right:120px;height:3px"></div>
    <div class="ln" style="top:322px;left:24px;right:24px;height:1px;background:#222"></div>
  </div>
  <div class="rule"></div>
  <div class="foot">github.com/imhuhe/gongwen-kit</div>
</div></body></html>
